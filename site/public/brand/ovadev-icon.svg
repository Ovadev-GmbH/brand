<!-- Ovadev icon, from Landing/apps/ova/public/icon.svg. Its paper is dropped — the
     background is a switch here — and so is the red quadrant: it is an accent, and
     flattening it into the same ink would turn the mark into a solid square. This
     studio is black and white, so this is the monochrome cut. -->
